spring:
  application:
    name: pulse-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${DATABASE_USERNAME:pulse}
    password: ${DATABASE_PASSWORD:pulse}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    expiration-ms: 86400000
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
