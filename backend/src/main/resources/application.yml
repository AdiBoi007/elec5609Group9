spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: pulse-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # The Supabase session pooler allows 15 clients for the whole project, shared by
      # production (up to 10, see application-prod.yml) and every teammate's local run.
      # Hikari's default of 10 lets one local run exhaust it, so keep dev small and idle-free.
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

supabase:
  issuer: ${SUPABASE_ISSUER:https://jchfppwirlvkimjrtqmk.supabase.co/auth/v1}
  jwks-uri: ${SUPABASE_JWKS_URI:https://jchfppwirlvkimjrtqmk.supabase.co/auth/v1/.well-known/jwks.json}

app:
  preview-auth: ${PREVIEW_AUTH:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
