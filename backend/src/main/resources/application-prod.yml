spring:
  main:
    lazy-initialization: true
  datasource:
    hikari:
      # Serverless instances scale horizontally; each should hold very few
      # connections against the Supabase transaction pooler (port 6543).
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 280000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        archive:
          autodetection: none
        boot:
          allow_jdbc_metadata_access: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
