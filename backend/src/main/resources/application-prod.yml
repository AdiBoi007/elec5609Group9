spring:
  # Eager initialization (the default) is deliberate: on a persistent container
  # host the web port only opens once every bean is built, so "live" means truly
  # ready and the first request is already fast. Do not add
  # spring.main.lazy-initialization here - it would only defer that work into the
  # first request after a cold start, which is exactly when we want it fast.
  datasource:
    hikari:
      # Serverless instances scale horizontally; each should hold very few
      # connections against the Supabase transaction pooler (port 6543).
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 280000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        archive:
          autodetection: none
        boot:
          allow_jdbc_metadata_access: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
