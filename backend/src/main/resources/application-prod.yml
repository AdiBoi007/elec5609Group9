spring:
  main:
    # Vercel Hobby kills a container that is not ready within ~10s. Eager init
    # (JPA + every bean at boot) overruns that, so the container is killed
    # mid-boot and never becomes ready -> every request 500s. Lazy init gets
    # Spring to "Started" in ~7.7s, which fits, so the container survives and
    # Fluid Compute keeps it warm. Cost: the first request(s) after a cold start
    # pay the deferred init and may time out; after that it serves warm (~0.3s).
    lazy-initialization: true
  datasource:
    hikari:
      # Serverless instances scale horizontally; each should hold very few
      # connections against the Supabase transaction pooler (port 6543).
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 280000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        archive:
          autodetection: none
        boot:
          allow_jdbc_metadata_access: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
