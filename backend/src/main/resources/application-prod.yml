spring:
  main:
    lazy-initialization: true
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        archive:
          autodetection: none
        boot:
          allow_jdbc_metadata_access: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
