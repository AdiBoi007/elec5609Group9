spring:
  # Eager initialization (the default) is deliberate: on a persistent container
  # host the web port only opens once every bean is built, so "live" means truly
  # ready and the first request is already fast. Do not add
  # spring.main.lazy-initialization here - it would only defer that work into the
  # first request after a cold start, which is exactly when we want it fast.
  datasource:
    hikari:
      # One long-lived container against the Supabase session pooler (port 5432),
      # so connections can be held and reused rather than churned. The pool is the
      # whole service's concurrent DB capacity: sized for a small group using the
      # app at once, not for one connection per user (a connection is only held
      # for the duration of a transaction).
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      # Retire connections well before the pooler would drop them server-side.
      max-lifetime: 600000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        archive:
          autodetection: none
        boot:
          allow_jdbc_metadata_access: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
